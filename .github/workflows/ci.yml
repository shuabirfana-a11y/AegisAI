name: AegisAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/backend, feature/frontend]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegisai-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Refuse tracked secrets and local data
        run: python scripts/ci/check_repository.py
      - name: Engineering failure gate tests
        run: python -m unittest discover -s tests/engineering -v
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --retry 2 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all Git history with redaction
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all --full-history" .'

  backend:
    name: Backend unit and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MODEL_PROVIDER: mock
      MODEL_EMBEDDING_PROVIDER: mock
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install portable baseline requirements
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
      - name: Backend portable unit baseline
        run: python scripts/ci/run_backend_tests.py
      - name: Pydantic, OpenAPI and Mock contract consistency
        run: python scripts/ci/check_contracts.py
      - name: AegisBench offline contracts and metrics
        run: python -m pytest tests/aegisbench -q
      - name: AegisBench offline pilot (quality availability is reported explicitly)
        run: python evaluate.py --output work/ci-aegisbench

  frontend:
    name: Frontend tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/package-lock.json
      - name: Install separate CI type checker
        run: npm ci --prefix .github --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript
        run: node scripts/ci/check_frontend.mjs
      - name: Existing frontend tests
        working-directory: frontend
        run: npm test
      - name: Check exported TypeScript contracts
        run: node .github/node_modules/typescript/bin/tsc -p .github/tsconfig.contracts.json
      - name: Application build status
        run: echo "NOT_APPLICABLE - current native JavaScript frontend has no build script."
