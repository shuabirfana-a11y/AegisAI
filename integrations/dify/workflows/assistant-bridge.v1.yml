version: 0.7.0
kind: app
dependencies: []
app:
  name: AegisAI Assistant Bridge
  description: Phase 9 fixed HTTP integration. Model-free; backend is the source of
    facts and audit records.
  mode: workflow
  icon: 🛡️
  icon_background: '#FFFFFF'
  use_icon_as_answer_icon: false
workflow:
  conversation_variables: []
  environment_variables:
  - id: 1c8b6e43-8072-5a50-b74d-caab469e4915
    name: AEGIS_ASSET_TOKEN
    value_type: secret
    value: ''
    description: Configure privately after import; equals the backend server credential.
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      data:
        type: start
        title: Input
        desc: Validated structured inputs; no URL, SQL or shell input.
        variables:
        - variable: question
          label: question
          type: paragraph
          required: true
          max_length: 2000
          options: []
          default: null
        - variable: mode
          label: mode
          type: select
          required: true
          max_length: 128
          options:
          - auto
          - fast
          - deep
          default: auto
        - variable: request_key
          label: request_key
          type: text-input
          required: true
          max_length: 128
          options: []
          default: null
        - variable: realtime
          label: realtime
          type: select
          required: true
          max_length: 128
          options:
          - 'false'
          - 'true'
          default: 'false'
        - variable: asset_id
          label: asset_id
          type: text-input
          required: false
          max_length: 36
          options: []
          default: null
        - variable: target
          label: target
          type: text-input
          required: false
          max_length: 128
          options: []
          default: null
      position:
        x: 0
        y: 160
      positionAbsolute:
        x: 0
        y: 160
      height: 100
      width: 244
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: serialize
      type: custom
      data:
        type: code
        title: Serialize JSON safely
        desc: Fixed authored serializer; question remains data.
        code_language: python3
        code: "import json\nimport re\nimport uuid\n\ndef main(question: str, mode:\
          \ str, request_key: str, realtime: str, asset_id: str = \"\", target: str\
          \ = \"\") -> dict:\n    if not isinstance(question, str) or not question.strip()\
          \ or len(question) > 2000:\n        raise ValueError(\"question must contain\
          \ 1..2000 characters\")\n    if mode not in (\"auto\", \"fast\", \"deep\"\
          ):\n        raise ValueError(\"unsupported mode\")\n    if not isinstance(request_key,\
          \ str) or not request_key or len(request_key) > 128:\n        raise ValueError(\"\
          request_key must contain 1..128 characters\")\n    if realtime not in (\"\
          false\", \"true\"):\n        raise ValueError(\"realtime must be false or\
          \ true\")\n    payload = {\"question\": question, \"mode\": mode, \"request_key\"\
          : request_key, \"realtime\": realtime == \"true\"}\n    if asset_id:\n \
          \       payload[\"asset_id\"] = str(uuid.UUID(asset_id))\n    if target:\n\
          \        if not re.fullmatch(r\"CVE-[0-9]{4}-[0-9]{4,}\", target):\n   \
          \         target = str(uuid.UUID(target))\n        payload[\"target\"] =\
          \ target\n    return {\"request_json\": json.dumps(payload, ensure_ascii=False)}\n"
        variables:
        - variable: question
          value_selector:
          - start
          - question
        - variable: mode
          value_selector:
          - start
          - mode
        - variable: request_key
          value_selector:
          - start
          - request_key
        - variable: realtime
          value_selector:
          - start
          - realtime
        - variable: asset_id
          value_selector:
          - start
          - asset_id
        - variable: target
          value_selector:
          - start
          - target
        outputs:
          request_json:
            type: string
            children: null
      position:
        x: 300
        y: 160
      positionAbsolute:
        x: 300
        y: 160
      height: 100
      width: 244
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: backend_http
      type: custom
      data:
        type: http-request
        title: AegisAI protected backend
        desc: Fixed internal gateway; backend enforces ownership, tool allowlist and
          budgets.
        method: POST
        url: http://aegis_gateway:8080/api/v1/assistant/query
        authorization:
          type: api-key
          config:
            type: bearer
            api_key: '{{#env.AEGIS_ASSET_TOKEN#}}'
        headers: 'Content-Type:application/json

          Accept:application/json'
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: '{{#serialize.request_json#}}'
        timeout:
          connect: 5
          read: 300
          write: 30
        ssl_verify: true
        retry_config:
          retry_enabled: false
          max_retries: 0
          retry_interval: 0
      position:
        x: 600
        y: 160
      positionAbsolute:
        x: 600
        y: 160
      height: 100
      width: 244
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: parse
      type: custom
      data:
        type: code
        title: Validate structured response
        desc: Preserves evidence, uncertainty and backend integration-gate result.
        code_language: python3
        code: "import json\n\ndef main(body: str, status_code: int) -> dict:\n   \
          \ if not 200 <= status_code < 300:\n        raise ValueError(\"AegisAI backend\
          \ HTTP error: \" + str(status_code))\n    result = json.loads(body)\n  \
          \  if not isinstance(result, dict):\n        raise ValueError(\"AegisAI\
          \ response must be a JSON object\")\n    if len(body.encode(\"utf-8\"))\
          \ > 190000:\n        raise ValueError(\"AegisAI response exceeds bridge\
          \ result budget\")\n    return {\"result_json\": body, \"http_status\":\
          \ status_code}\n"
        variables:
        - variable: body
          value_selector:
          - backend_http
          - body
        - variable: status_code
          value_selector:
          - backend_http
          - status_code
        outputs:
          result_json:
            type: string
            children: null
          http_status:
            type: number
            children: null
      position:
        x: 900
        y: 160
      positionAbsolute:
        x: 900
        y: 160
      height: 100
      width: 244
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: end
      type: custom
      data:
        type: end
        title: Auditable backend result
        desc: No LLM narration is configured in this bridge.
        outputs:
        - variable: result_json
          value_selector:
          - parse
          - result_json
          value_type: string
        - variable: http_status
          value_selector:
          - parse
          - http_status
          value_type: number
      position:
        x: 1200
        y: 160
      positionAbsolute:
        x: 1200
        y: 160
      height: 100
      width: 244
      selected: false
      sourcePosition: right
      targetPosition: left
    edges:
    - id: start-serialize
      source: start
      target: serialize
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: start
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: serialize-backend_http
      source: serialize
      target: backend_http
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: code
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: backend_http-parse
      source: backend_http
      target: parse
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: http-request
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: parse-end
      source: parse
      target: end
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: code
        targetType: end
        isInIteration: false
        isInLoop: false
    viewport:
      x: 0
      y: 0
      zoom: 0.7
