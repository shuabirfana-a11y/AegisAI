# Merge with the official pinned Dify docker/docker-compose.yaml.
# Requires Docker Compose >= 2.24.4 for !override.
services:
  nginx:
    ports: !override
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8443:443"
  plugin_daemon:
    ports: !override
      - "127.0.0.1:5003:5003"
  # These shell services are unnecessary for the HTTP bridge workflows.
  local_sandbox:
    profiles: [aegis_disabled_agent_shell]
  agent_ssrf_proxy:
    profiles: [aegis_disabled_agent_shell]
  aegis_gateway:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./aegis-gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - ssrf_proxy_network
    # Deliberately has no host port. The Dify HTTP node uses this fixed address.
