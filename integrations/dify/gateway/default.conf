server {
    listen 8080;
    server_name aegis_gateway;
    access_log off;
    server_tokens off;
    client_max_body_size 64k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 30s;
    # Fixed target. Docker Desktop host reachability must be tested explicitly.
    # Backend remains bound to 127.0.0.1:8000; do not widen it to the LAN.
    set $aegis_backend http://host.docker.internal:8000;
    resolver 127.0.0.11 valid=30s ipv6=off;
    location = /api/v1/assistant/query {
        limit_except POST { deny all; }
        proxy_pass $aegis_backend;
    }
    location = /api/v1/tools/contracts {
        limit_except GET { deny all; }
        proxy_pass $aegis_backend;
    }
    location ~ ^/api/v1/tools/[a-z_]+$ {
        limit_except POST { deny all; }
        proxy_pass $aegis_backend;
    }
    location / { return 404; }
}
