services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${AEGIS_DB_PASSWORD:?Set AEGIS_DB_PASSWORD in the environment}
      POSTGRES_DB: aegis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aegis_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    profiles: ["api"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis:${AEGIS_DB_PASSWORD:?Set AEGIS_DB_PASSWORD in the environment}@postgres:5432/aegis
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - aegis_ingestion_cache:/app/work
volumes:
  aegis_pg_data:
  aegis_ingestion_cache:
